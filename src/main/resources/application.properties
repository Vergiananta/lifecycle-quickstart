# HTTP Port
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-request-id
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# PostgreSQL Datasource configuration (Local by default)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehicle-db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgrespassword}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway Database Migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# MongoDB Configuration (Local by default)
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGO_DB:vehicle}

# Jackson snake_case naming strategy (Requirement contract)
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false

# OpenAPI & Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Health Check
quarkus.smallrye-health.root-path=/q/health

# Application Checkpoint & Config
app.checklist.path=checklist.json

